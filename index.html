        // Custom Donut Chart Component with Strict Anti-Collision
        const CustomDonutChart = ({ categories }) => {
            const svgRef = useRef(null);
            
            // Filter categories > 0 and sort by amount
            const validData = categories.filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);
            const total = validData.reduce((acc, c) => acc + c.amount, 0);
            
            const centerX = 200;
            const centerY = 200;
            const radius = 100;
            const innerRadius = 60;
            const textOffset = 40; // distance from outer radius
            
            let currentAngle = -Math.PI / 2; // Start at top
            
            const paths = [];
            const leftLabels = [];
            const rightLabels = [];

            validData.forEach((item, index) => {
                const sliceAngle = (item.amount / total) * 2 * Math.PI;
                const endAngle = currentAngle + sliceAngle;
                
                // Calculate SVG Path for Donut Slice
                const x1 = centerX + radius * Math.cos(currentAngle);
                const y1 = centerY + radius * Math.sin(currentAngle);
                const x2 = centerX + radius * Math.cos(endAngle);
                const y2 = centerY + radius * Math.sin(endAngle);
                const x1Inner = centerX + innerRadius * Math.cos(currentAngle);
                const y1Inner = centerY + innerRadius * Math.sin(currentAngle);
                const x2Inner = centerX + innerRadius * Math.cos(endAngle);
                const y2Inner = centerY + innerRadius * Math.sin(endAngle);

                const largeArcFlag = sliceAngle > Math.PI ? 1 : 0;

                const pathData = `
                    M ${x1} ${y1}
                    A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}
                    L ${x2Inner} ${y2Inner}
                    A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${x1Inner} ${y1Inner}
                    Z
                `;
                paths.push({ d: pathData, color: item.color, id: item.id });

                // Label Positioning Logic
                const midAngle = currentAngle + sliceAngle / 2;
                // strict point on outer radius (NO center penetration)
                const lineStartX = centerX + radius * Math.cos(midAngle);
                const lineStartY = centerY + radius * Math.sin(midAngle);
                
                // Target position
                const isLeft = Math.cos(midAngle) < 0;
                const rawY = centerY + (radius + textOffset) * Math.sin(midAngle);
                
                const labelObj = {
                    item,
                    lineStartX,
                    lineStartY,
                    midAngle,
                    rawY,
                    isLeft
                };

                if (isLeft) leftLabels.push(labelObj);
                else rightLabels.push(labelObj);

                currentAngle = endAngle;
            });

            // Anti-Collision Algorithm (Vertical Spacing)
            const resolveCollisions = (labels, side) => {
                labels.sort((a, b) => a.rawY - b.rawY);
                const minGap = 28; // minimum vertical space between labels
                
                // First pass: Push down
                for (let i = 1; i < labels.length; i++) {
                    if (labels[i].rawY - labels[i-1].rawY < minGap) {
                        labels[i].rawY = labels[i-1].rawY + minGap;
                    }
                }
                // Second pass: Push up if overflowed beyond SVG bottom
                for (let i = labels.length - 2; i >= 0; i--) {
                    if (labels[i+1].rawY - labels[i].rawY < minGap) {
                        labels[i].rawY = labels[i+1].rawY - minGap;
                    }
                }
                
                // Map to final drawing coordinates
                return labels.map(l => {
                    const lineMidX = l.lineStartX + (side === 'left' ? -15 : 15);
                    const lineEndX = side === 'left' ? centerX - 160 : centerX + 160;
                    return {
                        ...l,
                        y: l.rawY,
                        textX: side === 'left' ? lineEndX - 5 : lineEndX + 5,
                        textAnchor: side === 'left' ? 'end' : 'start',
                        polyline: `${l.lineStartX},${l.lineStartY} ${lineMidX},${l.rawY} ${lineEndX},${l.rawY}`
                    };
                });
            };

            const finalLeft = resolveCollisions(leftLabels, 'left');
            const finalRight = resolveCollisions(rightLabels, 'right');
            const allLabels = [...finalLeft, ...finalRight];

            return (
                <div className="w-full flex justify-center items-center py-10 overflow-visible">
                    <svg width="100%" height="400" viewBox="0 0 400 400" className="overflow-visible">
                        {/* Shadow/Glow effect definitions */}
                        <defs>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        
                        {/* Donut Slices */}
                        <g transform="translate(0, 0)">
                            {paths.map((p, i) => (
                                <path 
                                    key={i} 
                                    d={p.d} 
                                    fill={p.color} 
                                    stroke="#101012" 
                                    strokeWidth="2"
                                    className="transition-all duration-500 hover:opacity-80 cursor-pointer"
                                    style={{ animation: `fadeInUp 0.5s ease-out ${(i*0.05)}s forwards`, opacity: 0 }}
                                />
                            ))}
                        </g>

                        {/* Polylines and Labels */}
                        {allLabels.map((l, i) => (
                            <g key={`label-${i}`} style={{ animation: `fadeInUp 0.5s ease-out 0.5s forwards`, opacity: 0 }}>
                                <polyline 
                                    points={l.polyline} 
                                    fill="none" 
                                    stroke={l.item.color} 
                                    strokeWidth="1.5" 
                                    opacity="0.6"
                                />
                                <text 
                                    x={l.textX} 
                                    y={l.y - 4} 
                                    fill="#E5E7EB" 
                                    fontSize="12" 
                                    fontWeight="bold" 
                                    textAnchor={l.textAnchor}
                                >
                                    {l.item.name}
                                </text>
                                <text 
                                    x={l.textX} 
                                    y={l.y + 12} 
                                    fill="#9CA3AF" 
                                    fontSize="11" 
                                    textAnchor={l.textAnchor}
                                >
                                    {l.item.percentage}%
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('main'); // main, detail, chart
            const [selectedCategory, setSelectedCategory] = useState(null);
            
            // AI State
            const [showAI, setShowAI] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResult, setAiResult] = useState('');

            // Handlers
            const openDetail = (category) => {
                setSelectedCategory(category);
                setView('detail');
            };
            const closeDetail = () => setView('main');
            const openChart = () => setView('chart');
            const closeChart = () => setView('main');

            const triggerAIAnalysis = async () => {
                setShowAI(true);
                setAiLoading(true);
                
                try {
                    // Netlify Serverless Function Endpoint (Expected logic)
                    const response = await fetch('/api/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            totalAmount: rawData.totalAmount, 
                            categories: rawData.categories.map(c => ({ name: c.name, amount: c.amount, percentage: c.percentage }))
                        })
                    });
                    
                    if (!response.ok) throw new Error('API config missing or failed');
                    const data = await response.json();
                    setAiResult(data.text);
                } catch (error) {
                    // Fallback Mock Logic (When Netlify function is not available or errors out)
                    setTimeout(() => {
                        setAiResult(`📊 **6월 소비 분석 리포트**\n\n고객님의 이번 달 총 지출은 **${formatCurrency(rawData.totalAmount)}**입니다.\n\n💡 **핵심 요약**\n• **식비(28.2%)** 비율이 가장 높습니다. 배달의민족 등 배달 앱 지출이 두드러집니다. 다음 달에는 집밥 비율을 조금 늘려보는 건 어떨까요?\n• **보험/세금(15.9%)** 및 **주거/통신(11.0%)** 등 고정비 지출이 탄탄하게 관리되고 있습니다.\n• 취소된 할부/결제 내역은 총액에서 안전하게 자동 제외 처리되었습니다.\n\n✨ **다음 달 절약 팁**\n외식 횟수를 주 1회 줄이면 약 15만 원을 추가로 저축할 수 있어요. 화이팅!`);
                    }, 1800);
                } finally {
                    setAiLoading(false);
                }
            };

            return (
                <div className="relative w-full max-w-md mx-auto min-h-screen bg-[#101012] shadow-2xl overflow-hidden font-sans">
                    
                    {/* View 1: Main Dashboard */}
                    <div className={`absolute inset-0 w-full h-full overflow-y-auto hide-scrollbar transition-transform duration-300 ${view === 'main' ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 pb-24">
                            {/* Header */}
                            <div className="mb-8 pt-4">
                                <div className="flex items-center text-gray-400 mb-2">
                                    <i className="fas fa-chevron-left text-sm mr-2"></i>
                                    <span className="text-lg font-semibold">{rawData.month}월</span>
                                    <i className="fas fa-caret-right text-sm ml-2"></i>
                                </div>
                                <h1 className="text-3xl font-bold text-white tracking-tight">{formatCurrency(rawData.totalAmount)}</h1>
                            </div>

                            {/* CTA Chart Banner */}
                            <div onClick={openChart} className="animate-pulse-glow glass-panel rounded-2xl p-5 mb-8 flex justify-between items-center cursor-pointer active:scale-95 transition-transform">
                                <div>
                                    <h2 className="text-white font-bold text-lg mb-1">내 소비에 딱 맞는 분석</h2>
                                    <p className="text-gray-400 text-sm">카테고리별 비중 한눈에 보기</p>
                                </div>
                                <div className="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center relative">
                                    <i className="fas fa-chart-pie text-blue-400 text-xl"></i>
                                    <span className="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                                    <span className="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full"></span>
                                </div>
                            </div>

                            {/* Category List */}
                            <div className="space-y-1">
                                <h3 className="text-gray-400 text-sm font-medium mb-4 px-1">카테고리별 소비</h3>
                                {rawData.categories.map((cat, index) => (
                                    <div 
                                        key={cat.id} 
                                        onClick={() => openDetail(cat)}
                                        className="flex items-center justify-between p-3 rounded-xl hover:bg-[#1C1C1F] cursor-pointer transition-colors fade-in-up"
                                        style={{ animationDelay: `${index * 0.05}s` }}
                                    >
                                        <div className="flex items-center">
                                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-xl mr-4" style={{ backgroundColor: `${cat.color}20`, color: cat.color }}>
                                                {cat.icon.length === 1 || cat.icon.length === 2 ? cat.icon : <span className="text-sm font-bold">{cat.icon}</span>}
                                            </div>
                                            <div>
                                                <div className="text-gray-200 font-medium">{cat.name}</div>
                                                <div className="text-gray-500 text-sm">{cat.percentage}% | {formatCurrency(cat.amount)}</div>
                                            </div>
                                        </div>
                                        <i className="fas fa-chevron-right text-gray-600 text-sm"></i>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* View 2: Category Detail */}
                    <div className={`absolute inset-0 w-full h-full bg-[#101012] z-10 overflow-y-auto hide-scrollbar transition-transform duration-300 ${view === 'detail' ? 'translate-x-0' : 'translate-x-full'}`}>
                        {selectedCategory && (
                            <div className="p-6 pb-24">
                                <div className="flex items-center mb-8 pt-4">
                                    <button onClick={closeDetail} className="w-10 h-10 flex items-center justify-center text-white mr-2 rounded-full hover:bg-gray-800">
                                        <i className="fas fa-arrow-left"></i>
                                    </button>
                                    <span className="text-lg font-semibold text-gray-300">소비 카테고리</span>
                                </div>
                                
                                <div className="mb-8 flex justify-between items-end px-2">
                                    <div>
                                        <p className="text-gray-400 text-sm mb-1">2026년 {rawData.month}월 {selectedCategory.name} 총 금액</p>
                                        <h2 className="text-3xl font-bold text-white">{formatCurrency(selectedCategory.amount)}</h2>
                                    </div>
                                    <div className="w-14 h-14 rounded-full flex items-center justify-center text-2xl" style={{ backgroundColor: selectedCategory.color, color: '#fff' }}>
                                        {selectedCategory.icon.length <= 2 ? selectedCategory.icon : <span className="text-sm font-bold">{selectedCategory.icon}</span>}
                                    </div>
                                </div>

                                <div className="h-[1px] bg-gray-800 w-full mb-6"></div>

                                <div className="space-y-6">
                                    {selectedCategory.items.map((item, idx) => {
                                        const brand = getBrandInfo(item.name);
                                        return (
                                            <div key={idx} className={`fade-in-up flex justify-between items-center ${!item.active ? 'opacity-40 grayscale' : ''}`} style={{ animationDelay: `${idx * 0.05}s` }}>
                                                <div className="flex items-center">
                                                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold mr-4" style={{ backgroundColor: brand.bg, color: brand.color }}>
                                                        {brand.logoText.length <= 2 ? brand.logoText : <i className={brand.icon}></i>}
                                                    </div>
                                                    <div>
                                                        <div className={`font-medium ${!item.active ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                                                            {item.active ? `-${item.amount.toLocaleString()}` : `취소됨`}원
                                                        </div>
                                                        <div className="text-gray-500 text-xs mt-1">{item.name} | {item.desc}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* View 3: Chart Modal */}
                    <div className={`absolute inset-0 w-full h-full bg-[#101012] z-20 overflow-y-auto hide-scrollbar transition-transform duration-300 ${view === 'chart' ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="p-6">
                            <div className="flex items-center justify-between mb-8 pt-4">
                                <span className="text-lg font-semibold text-gray-300">카테고리 분석</span>
                                <button onClick={closeChart} className="w-10 h-10 flex items-center justify-center text-gray-400 bg-gray-800 rounded-full hover:bg-gray-700">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                            
                            {/* Summary Banner Separated from Chart */}
                            <div className="bg-[#1C1C1F] rounded-2xl p-6 text-center mb-4 border border-gray-800 shadow-lg">
                                <h3 className="text-gray-400 text-sm mb-2">{rawData.month}월 총 지출 금액</h3>
                                <div className="text-3xl font-bold text-white tracking-tight">{formatCurrency(rawData.totalAmount)}</div>
                            </div>

                            <CustomDonutChart categories={rawData.categories} />
                            
                            <div className="mt-8 space-y-3 bg-[#1C1C1F] rounded-2xl p-5 border border-gray-800">
                                {rawData.categories.filter(c=>c.amount>0).slice(0, 3).map((cat, i) => (
                                    <div key={i} className="flex justify-between items-center text-sm">
                                        <div className="flex items-center text-gray-300">
                                            <span className="w-3 h-3 rounded-full mr-2" style={{ backgroundColor: cat.color }}></span>
                                            {cat.name}
                                        </div>
                                        <div className="font-medium text-white">{cat.percentage}%</div>
                                    </div>
                                ))}
                                <div className="text-center text-xs text-gray-500 pt-3 mt-3 border-t border-gray-800">Top 3 지출 카테고리</div>
                            </div>
                        </div>
                    </div>

                    {/* Floating Action Button (FAB) for AI */}
                    <button 
                        onClick={triggerAIAnalysis}
                        className="absolute bottom-6 right-6 w-14 h-14 bg-gradient-to-tr from-blue-600 to-purple-500 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.6)] flex items-center justify-center text-white text-xl z-30 hover:scale-105 transition-transform"
                    >
                        <i className="fas fa-robot"></i>
                    </button>

                    {/* AI Analysis Modal */}
                    {showAI && (
                        <div className="absolute inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm" onClick={() => !aiLoading && setShowAI(false)}>
                            <div 
                                className="w-full bg-[#1C1C1F] rounded-t-3xl p-6 shadow-2xl border-t border-gray-700 slide-in" 
                                onClick={e => e.stopPropagation()}
                                style={{ maxHeight: '80vh', overflowY: 'auto' }}
                            >
                                <div className="flex justify-between items-center mb-6">
                                    <div className="flex items-center text-lg font-bold text-white">
                                        <i className="fas fa-sparkles text-blue-400 mr-2"></i>
                                        AI 소비 리포트
                                    </div>
                                    <button onClick={() => setShowAI(false)} className="text-gray-400 hover:text-white">
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                
                                {aiLoading ? (
                                    <div className="space-y-4">
                                        <div className="h-4 bg-gray-700 skeleton w-3/4"></div>
                                        <div className="h-4 bg-gray-700 skeleton w-full"></div>
                                        <div className="h-4 bg-gray-700 skeleton w-5/6"></div>
                                        <div className="h-24 bg-gray-700 skeleton w-full mt-6 rounded-xl"></div>
                                        <p className="text-center text-xs text-gray-500 mt-4 animate-pulse">데이터를 분석하고 있습니다...</p>
                                    </div>
                                ) : (
                                    <div className="text-gray-200 text-sm leading-relaxed whitespace-pre-wrap">
                                        {aiResult}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
