            const donutData = React.useMemo(() => {
                const cx = 600, cy = 600, r = 160, strokeWidth = 60;
                let cumulativePercent = 0;
                
                const slices = RAW_DATA.map(cat => {
                    const start = cumulativePercent;
                    cumulativePercent += cat.percent;
                    const midPercent = start + (cat.percent / 2);
                    // -90도(상단)에서 시작하는 각도
                    const midAngle = (midPercent / 100) * Math.PI * 2 - Math.PI / 2;
                    return { ...cat, start, midAngle };
                });

                // 항목 간 텍스트가 겹치지 않도록 물리적(Spring) 이격 처리 알고리즘
                // 각도를 0 ~ 2PI로 정규화
                let angles = slices.map(s => s.midAngle);
                for(let i=1; i<angles.length; i++) {
                    while(angles[i] <= angles[i-1]) angles[i] += Math.PI * 2;
                }
                
                // 14개 항목이 360도를 여유롭게 나눠 갖도록 최소 간격 부여 (충돌 완전 방지)
                const MIN_DIST = (Math.PI * 2) / 14.5; 
                
                for (let iter = 0; iter < 100; iter++) {
                    for (let i = 0; i < angles.length; i++) {
                        let next = (i + 1) % angles.length;
                        let diff = angles[next] - angles[i];
                        if (i === angles.length - 1) diff += Math.PI * 2; // 원형 래핑

                        if (diff < MIN_DIST) {
                            let push = (MIN_DIST - diff) / 2;
                            angles[i] -= push;
                            if (i === angles.length - 1) {
                                angles[0] += push;
                            } else {
                                angles[next] += push;
                            }
                        }
                    }
                }

                const LABEL_RADIUS = 360; // 도넛(160) 밖으로 넉넉하게 밀어냄

                slices.forEach((slice, i) => {
                    let la = angles[i];
                    let isRight = Math.cos(la) >= -0.001;
                    
                    slice.labelAngle = la;
                    slice.isRight = isRight;

                    // 지시선의 시작점 (도넛의 중심이 아닌 가장자리에서 출발하여 관통 방지)
                    slice.innerX = cx + (r + 10) * Math.cos(slice.midAngle);
                    slice.innerY = cy + (r + 10) * Math.sin(slice.midAngle);
                    
                    // 지시선이 꺾이는 지점 (방사형 목표 지점)
                    let elbowX = cx + LABEL_RADIUS * Math.cos(la);
                    let elbowY = cy + LABEL_RADIUS * Math.sin(la);
                    
                    slice.outerX = elbowX;
                    slice.outerY = elbowY;

                    slice.labelY = elbowY;
                });

                return slices;

                                                    const brandStyle = getBrandStyle(item.name, selectedCategory.color, selectedCategory.icon);
                                                    return (
                                                        <div key={i} className={`flex justify-between items-center group cursor-pointer active:opacity-60 transition-opacity ${item.isDimmed ? 'opacity-40 grayscale' : ''}`}>
                                                            <div className="flex items-center gap-3 w-full">
                                                                <div className={`w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center ${brandStyle.bg} ${brandStyle.text} ${brandStyle.border}`}>
                                                                    {brandStyle.content}
                                                                </div>
                                                                <div className="flex flex-col flex-1 overflow-hidden pr-2">
                                                                    <div className="flex justify-between items-center w-full">
                                                                        <span className={`text-[15px] font-medium text-gray-100 truncate ${item.isDimmed ? 'line-through text-gray-500' : ''}`}>{item.name}</span>
                                                                        <span className={`text-[16px] font-bold flex-shrink-0 ${item.isDimmed ? 'line-through text-gray-500' : ''}`}>
                                                                            -{item.amount.toLocaleString()}원
                                                                        </span>
                                                                    </div>
                                                                    {item.desc && (
                                                                        <span className="text-[13px] text-gray-500 mt-0.5 truncate">{item.desc}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* Donut Chart Modal - 8방향 방사형 및 중앙 텍스트 분리형 */}
                    {isChartOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 backdrop-blur-md transition-opacity sm:p-6" onClick={() => setIsChartOpen(false)}>
                            <div className="bg-[#151516] w-full h-full sm:h-auto sm:max-h-[95vh] sm:max-w-4xl sm:rounded-3xl shadow-2xl animate-[slideUp_0.3s_ease-out] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                                
                                {/* Header & Total Amount Banner (차트와 텍스트 완전 분리) */}
                                <div className="pt-8 pb-5 px-6 border-b border-[#2c2c2e] bg-[#1c1c1e] shrink-0">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold text-white tracking-tight">카테고리별 비중</h2>
                                        <button onClick={() => setIsChartOpen(false)} className="text-gray-400 hover:text-white p-2 transition-colors rounded-full bg-[#2c2c2e]">
                                            <i className="fas fa-times text-xl"></i>
                                        </button>
                                    </div>
                                    <div className="bg-gradient-to-r from-[#28282a] to-[#202022] rounded-2xl p-5 flex justify-between items-center shadow-inner border border-[#333]">
                                        <span className="text-gray-400 font-medium">5월 총 지출액</span>
                                        <span className="text-white font-extrabold text-3xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                                            {TOTAL_AMOUNT.toLocaleString()}<span className="text-xl ml-1 text-gray-300">원</span>
                                        </span>
                                    </div>
                                </div>
                                
                                {/* Chart Area - 방사형 SVG */}
                                <div className="flex-1 relative w-full flex items-center justify-center bg-[#151516] overflow-y-auto p-4 md:p-8">
                                    <div className="w-full max-w-[650px] aspect-square mx-auto">
                                        <svg viewBox="0 0 1200 1200" className="w-full h-full object-contain">
                                            
                                            {/* Background Base Donut */}
                                            <circle cx="600" cy="600" r="160" fill="transparent" stroke="#222" strokeWidth="60" />
                                            
                                            {/* Arcs */}
                                            <g transform="rotate(-90 600 600)">
                                                {donutData.map((slice, i) => {
                                                    const strokeDasharray = `${(slice.percent / 100) * 2 * Math.PI * 160} ${2 * Math.PI * 160}`;
                                                    let offset = 0;
                                                    for (let j = 0; j < i; j++) {
                                                        offset += (donutData[j].percent / 100) * 2 * Math.PI * 160;
                                                    }
                                                    const strokeDashoffset = -offset;
                                                    
                                                    return (
                                                        <circle
                                                            key={`arc-${i}`}
                                                            cx="600" cy="600" r="160"
                                                            fill="transparent"
                                                            stroke={hexColorMap[slice.color] || '#888'}
                                                            strokeWidth="60"
                                                            strokeDasharray={strokeDasharray}
                                                            strokeDashoffset={strokeDashoffset}
                                                            className="transition-all duration-300 cursor-pointer hover:stroke-[72px]"
                                                            onClick={() => {
                                                                setIsChartOpen(false);
                                                                openDetail(slice);
                                                            }}
                                                        />
                                                    );
                                                })}
                                            </g>

                                            {/* Radial Labels and Connective Lines */}
                                            <g>
                                                {donutData.map((slice, i) => (
                                                    <g key={`label-group-${i}`} className="transition-opacity duration-300">
                                                        {/* 지시선 */}
                                                        <polyline
                                                            points={`${slice.innerX},${slice.innerY} ${slice.outerX},${slice.outerY} ${slice.labelX},${slice.labelY}`}
                                                            fill="none"
                                                            stroke="#555"
                                                            strokeWidth="2.5"
                                                            strokeDasharray="4 4"
                                                        />
                                                        {/* 지시선 시작 구체 포인트 */}
                                                        <circle cx={slice.innerX} cy={slice.innerY} r="5" fill={hexColorMap[slice.color]} />
                                                        
                                                        {/* 카테고리 명칭 */}
                                                        <text
                                                            x={slice.labelX + (slice.isRight ? 12 : -12)}
                                                            y={slice.labelY - 10}
                                                            textAnchor={slice.isRight ? "start" : "end"}
                                                            fill="#ffffff"
                                                            className="text-[17px] font-bold"
                                                        >
                                                            {slice.name}
                                                        </text>
                                                        
                                                        {/* 세부 수치 */}
                                                        <text
                                                            x={slice.labelX + (slice.isRight ? 12 : -12)}
                                                            y={slice.labelY + 22}
                                                            textAnchor={slice.isRight ? "start" : "end"}
                                                            fill="#9e9e9e"
                                                            className="text-[14px] font-semibold"
                                                        >
                                                            {slice.total.toLocaleString()}원 ({slice.percent.toFixed(1)}%)
                                                        </text>
                                                    </g>
                                                ))}
                                            </g>
                                            
                                            {/* 도넛 중심의 장식형 홀 포인트 */}
                                            <circle cx="600" cy="600" r="120" fill="#151516" />
                                            <i className="fas fa-chart-pie text-gray-700 text-3xl" style={{ transform: 'translate(585px, 585px)', position: 'absolute' }}></i>
                                        </svg>
                                    </div>
                                </div>
                                
                                {/* Bottom Close Panel (Mobile Safe Area Friendly) */}
                                <div className="p-5 border-t border-[#2c2c2e] bg-[#1c1c1e] text-center shrink-0">
                                    <button 
                                        onClick={() => setIsChartOpen(false)}
                                        className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-lg transition-colors shadow-lg"
                                    >
                                        돌아가기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI Floating Button & Bottom Analysis Panel */}
                    <AiAnalyzer totalAmount={TOTAL_AMOUNT} data={RAW_DATA} />
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
